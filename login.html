<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="container">
        <div class="welcome-section">
            <div class="round-image-container">
                <img src="./checklist icon.png" alt="Circular Image">
            </div>
        
            <h1>Welcome!!</h1>
            <p>To keep connected with your tasks Login</p>
        </div>

        <div class="login-section">
            <form id="login-form" onsubmit="return validateLogin()">
                <h2>Login</h2>
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Username">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Password">
                </div>
                <div class="remember-me">
                    <input type="checkbox" id="remember-me">
                    <label for="remember-me">Remember Me</label>
                </div>
                <button type="submit">Login</button>
                <div class="forgot">
                    <a href="">Forgot Password?</a>
                </div>
                <div class="divider">
                    <span>Or</span>
                </div>
            </form>
            <button class="sign-in-btn" onclick="redirectToSignIn()">Sign In</button>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
